[project]
name = "ai-sdk-agent"
version = "0.1.0"
description = "Travel Planning Agent with OpenAI and Traceloop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "traceloop-sdk>=0.30.0",
]

[project.scripts]
ai-sdk-agent = "ai_sdk_agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
