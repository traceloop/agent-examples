[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel Planning Agent with OpenAI Agents SDK and Traceloop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.6.3",
    "openai>=2.11.0",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "traceloop-sdk>=0.49.8",
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "mypy>=1.19.1",
]

[project.scripts]
travel-agent = "travel_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
